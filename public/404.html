<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Juriva Legal</title>
    <script type="text/javascript">
      // Single Page App redirect for GitHub Pages
      // Converts the path into a query-string parameter so index.html can restore it.
      // See: https://github.com/rafgraph/spa-github-pages
      // Keep 1 segment for GitHub Pages project subpaths (/lawyer-website), 0 for custom root domain (jurivalegal.in)
      var isGithubPagesRepo = window.location.hostname.indexOf('github.io') > -1 && window.location.pathname.indexOf('/lawyer-website') === 0;
      var pathSegmentsToKeep = isGithubPagesRepo ? 1 : 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
